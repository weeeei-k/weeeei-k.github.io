<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生活 — 黃帷凱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&family=Noto+Sans+TC:wght@200;300&display=swap" rel="stylesheet" />
  <style>
    :root { --black:#0a0a0a; --white:#f0ece4; --grey:#7a7672; --accent:#c8bfb0; --font-serif:'Noto Serif TC',serif; --font-sans:'Noto Sans TC',sans-serif; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--black);color:var(--white);font-family:var(--font-sans);font-weight:200;overflow-x:hidden;cursor:none;}
    .cursor{position:fixed;width:8px;height:8px;background:var(--white);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
    .cursor-follower{position:fixed;width:32px;height:32px;border:1px solid rgba(240,236,228,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:2rem 3rem;display:flex;justify-content:space-between;align-items:center;mix-blend-mode:difference;}
    .nav-logo{font-family:var(--font-serif);font-weight:200;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--white);text-decoration:none;}
    .nav-links{display:flex;gap:3rem;list-style:none;}
    .nav-links a{font-family:var(--font-sans);font-weight:200;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--white);text-decoration:none;opacity:.7;position:relative;transition:opacity .3s;}
    .nav-links a:hover{opacity:1;}
    .nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--white);transition:width .4s;}
    .nav-links a:hover::after{width:100%;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    .back-link{display:inline-flex;align-items:center;gap:.75rem;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);text-decoration:none;margin:8rem 3rem 0;transition:color .3s;opacity:0;animation:fadeUp .8s ease .2s forwards;}
    .back-link:hover{color:var(--white);}
    .back-link::before{content:'←';font-size:.8rem;}
    .page-header{padding:2rem 3rem 4rem;opacity:0;animation:fadeUp .9s ease .4s forwards;}
    .page-title{font-family:var(--font-serif);font-weight:200;font-size:clamp(3rem,6vw,5rem);letter-spacing:.05em;line-height:1;}
    .page-meta{display:flex;align-items:center;gap:2rem;margin-top:1.5rem;}
    .page-subtitle{font-size:.65rem;letter-spacing:.35em;text-transform:uppercase;color:var(--grey);}
    .page-count{font-size:.65rem;letter-spacing:.2em;color:var(--grey);}
    .photo-grid{padding:0 3rem 8rem;columns:3;column-gap:6px;}
    .photo-item{break-inside:avoid;margin-bottom:6px;position:relative;overflow:hidden;cursor:none;opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}
    .photo-item.visible{opacity:1;transform:translateY(0);}
    .photo-item img{width:100%;display:block;transition:transform .7s cubic-bezier(.25,.46,.45,.94),filter .5s;filter:brightness(.92);}
    .photo-item:hover img{transform:scale(1.03);filter:brightness(.7);}
    .photo-caption{position:absolute;bottom:0;left:0;right:0;padding:2rem 1.25rem 1.25rem;background:linear-gradient(to top,rgba(10,10,10,.8),transparent);font-family:var(--font-serif);font-size:.75rem;letter-spacing:.1em;color:var(--white);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;}
    .photo-item:hover .photo-caption{opacity:1;transform:translateY(0);}
    .lightbox{position:fixed;inset:0;background:rgba(10,10,10,.96);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;cursor:none;}
    .lightbox.active{opacity:1;visibility:visible;}
    .lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;transform:scale(.95);transition:transform .4s;}
    .lightbox.active img{transform:scale(1);}
    .lightbox-close{position:absolute;top:2rem;right:2rem;width:44px;height:44px;border:1px solid rgba(240,236,228,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:none;transition:border-color .3s;}
    .lightbox-close:hover{border-color:var(--white);}
    .lightbox-close svg,.lightbox-nav svg{width:16px;height:16px;stroke:var(--white);fill:none;stroke-width:1.5;}
    .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(240,236,228,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:none;transition:border-color .3s;}
    .lightbox-nav:hover{border-color:var(--white);}
    .lightbox-prev{left:2rem;} .lightbox-next{right:2rem;}
    .lightbox-counter{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-size:.6rem;letter-spacing:.3em;color:var(--grey);}
    .progress-line{position:fixed;top:0;left:0;height:1px;background:rgba(200,191,176,.6);z-index:200;width:0%;transition:width .1s linear;}
    @media(max-width:768px){nav{padding:1.5rem;}.back-link{margin:6rem 1.5rem 0;}.page-header{padding:1.5rem 1.5rem 3rem;}.photo-grid{padding:0 1.5rem 5rem;columns:2;}}
    @media(max-width:480px){.photo-grid{columns:1;}}
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>
  <div class="progress-line" id="progressLine"></div>
  <nav>
    <a href="index.html" class="nav-logo">WKH</a>
    <ul class="nav-links">
      <li><a href="works.html">作品集</a></li>
      <li><a href="about.html">關於</a></li>
      <li><a href="contact.html">聯絡</a></li>
    </ul>
  </nav>
  <a href="works.html" class="back-link">返回作品集</a>
  <div class="page-header">
    <h1 class="page-title">生活</h1>
    <div class="page-meta">
      <span class="page-subtitle">Life &nbsp;·&nbsp; Daily Records</span>
      <span class="page-count" id="photoCount"></span>
    </div>
  </div>

  <!-- =============================================
       生活 照片列表 — 新增照片在這裡複製貼上
       ============================================= -->
  <div class="photo-grid" id="photoGrid">
    <div class="photo-item" data-caption="寂靜"><img src="assets/images/fulls/01.jpg" alt="寂靜" loading="lazy"/><div class="photo-caption">寂靜</div></div>
    <div class="photo-item" data-caption="島嶼"><img src="assets/images/fulls/02.jpg" alt="島嶼" loading="lazy"/><div class="photo-caption">島嶼</div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/03.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/04.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/11.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/12.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/13.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/14.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/15.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/16.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
    <div class="photo-item" data-caption=""><img src="assets/images/fulls/17.jpg" alt="" loading="lazy"/><div class="photo-caption"></div></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightboxClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <div class="lightbox-nav lightbox-prev" id="lightboxPrev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
    <img id="lightboxImg" src="" alt=""/>
    <div class="lightbox-nav lightbox-next" id="lightboxNext"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <script>
    const cursor=document.getElementById('cursor'),follower=document.getElementById('cursorFollower');
    let mx=0,my=0,fx=0,fy=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
    (function anim(){fx+=(mx-fx)*.12;fy+=(my-fy)*.12;follower.style.left=fx+'px';follower.style.top=fy+'px';requestAnimationFrame(anim);})();
    document.querySelectorAll('a,.photo-item,.lightbox-close,.lightbox-nav').forEach(el=>{
      el.addEventListener('mouseenter',()=>{cursor.style.width='16px';cursor.style.height='16px';follower.style.width='56px';follower.style.height='56px';});
      el.addEventListener('mouseleave',()=>{cursor.style.width='8px';cursor.style.height='8px';follower.style.width='32px';follower.style.height='32px';});
    });
    window.addEventListener('scroll',()=>{document.getElementById('progressLine').style.width=(window.scrollY/(document.body.scrollHeight-window.innerHeight)*100)+'%';});
    const obs=new IntersectionObserver(entries=>{entries.forEach((e,i)=>{if(e.isIntersecting)setTimeout(()=>e.target.classList.add('visible'),i*60);});},{threshold:.1});
    document.getElementById('photoCount').textContent = document.querySelectorAll('.photo-item').length + ' works';
    document.querySelectorAll('.photo-item').forEach(el=>obs.observe(el));
    const lightbox=document.getElementById('lightbox'),lightboxImg=document.getElementById('lightboxImg'),lightboxCounter=document.getElementById('lightboxCounter');
    const photos=Array.from(document.querySelectorAll('.photo-item img'));
    let current=0;
    function openLightbox(i){current=i;lightboxImg.src=photos[current].src;lightboxCounter.textContent=(current+1)+' / '+photos.length;lightbox.classList.add('active');document.body.style.overflow='hidden';}
    function closeLightbox(){lightbox.classList.remove('active');document.body.style.overflow='';}
    photos.forEach((img,i)=>img.parentElement.addEventListener('click',()=>openLightbox(i)));
    document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click',()=>{current=(current-1+photos.length)%photos.length;lightboxImg.src=photos[current].src;lightboxCounter.textContent=(current+1)+' / '+photos.length;});
    document.getElementById('lightboxNext').addEventListener('click',()=>{current=(current+1)%photos.length;lightboxImg.src=photos[current].src;lightboxCounter.textContent=(current+1)+' / '+photos.length;});
    lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
    document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('active'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')document.getElementById('lightboxPrev').click();if(e.key==='ArrowRight')document.getElementById('lightboxNext').click();});
  </script>
</body>
</html>
