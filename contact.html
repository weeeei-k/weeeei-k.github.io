<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聯絡 — 黃帷凱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&family=Noto+Sans+TC:wght@200;300&display=swap" rel="stylesheet" />
  <style>
    :root { --black:#0a0a0a; --white:#f0ece4; --grey:#7a7672; --accent:#c8bfb0; --font-serif:'Noto Serif TC',serif; --font-sans:'Noto Sans TC',sans-serif; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--black);color:var(--white);font-family:var(--font-sans);font-weight:200;overflow-x:hidden;cursor:none;min-height:100vh;}
    .cursor{position:fixed;width:8px;height:8px;background:var(--white);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
    .cursor-follower{position:fixed;width:32px;height:32px;border:1px solid rgba(240,236,228,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:2rem 3rem;display:flex;justify-content:space-between;align-items:center;mix-blend-mode:difference;}
    .nav-logo{font-family:var(--font-serif);font-weight:200;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--white);text-decoration:none;}
    .nav-links{display:flex;gap:3rem;list-style:none;}
    .nav-links a{font-family:var(--font-sans);font-weight:200;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--white);text-decoration:none;opacity:.7;position:relative;transition:opacity .3s;}
    .nav-links a.active,
    .nav-links a:hover{opacity:1;}
    .nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--white);transition:width .4s;}
    .nav-links a.active::after,
    .nav-links a:hover::after{width:100%;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Layout */
    .contact-wrapper {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 7rem;
    }

    /* Left side */
    .contact-left {
      padding: 5rem 4rem 5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(240,236,228,0.08);
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .contact-label {
      font-size: .65rem;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--grey);
      display: block;
      margin-bottom: 2rem;
    }

    .contact-title {
      font-family: var(--font-serif);
      font-weight: 200;
      font-size: clamp(2.5rem, 4vw, 4rem);
      letter-spacing: .05em;
      line-height: 1.15;
    }

    .contact-desc {
      font-family: var(--font-serif);
      font-weight: 200;
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      line-height: 1.9;
      letter-spacing: .05em;
      color: rgba(240,236,228,.6);
      margin-top: 2.5rem;
      max-width: 380px;
    }

    .contact-desc em {
      color: var(--white);
      font-style: normal;
    }

    .contact-info {
      margin-top: auto;
      padding-top: 4rem;
    }

    .contact-info-item {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      margin-bottom: 2rem;
    }

    .contact-info-label {
      font-size: .6rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .contact-info-value {
      font-family: var(--font-serif);
      font-size: .95rem;
      letter-spacing: .05em;
      color: var(--white);
      text-decoration: none;
      transition: color .3s;
    }

    .contact-info-value:hover {
      color: var(--accent);
    }

    /* Right side — Form */
    .contact-right {
      padding: 5rem 3rem 5rem 4rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.5s forwards;
    }

    .form-group {
      margin-bottom: 3rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: .6rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 1rem;
      transition: color .3s;
    }

    .form-group:focus-within .form-label {
      color: var(--white);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,236,228,.15);
      padding: .75rem 0;
      font-family: var(--font-serif);
      font-weight: 200;
      font-size: 1rem;
      letter-spacing: .05em;
      color: var(--white);
      outline: none;
      transition: border-color .3s;
      -webkit-appearance: none;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-bottom-color: var(--white);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: rgba(240,236,228,.2);
      font-family: var(--font-serif);
    }

    .form-textarea {
      resize: none;
      height: 120px;
      display: block;
    }

    /* Underline animation */
    .form-line {
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--white);
      transition: width .4s ease;
    }

    .form-group:focus-within .form-line {
      width: 100%;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    /* Submit button */
    .form-submit {
      display: inline-flex;
      align-items: center;
      gap: 1.5rem;
      background: transparent;
      border: 1px solid rgba(240,236,228,.3);
      color: var(--white);
      font-family: var(--font-sans);
      font-weight: 200;
      font-size: .7rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      padding: 1.1rem 2.5rem;
      cursor: none;
      transition: border-color .3s, background .3s;
      margin-top: 1rem;
    }

    .form-submit:hover {
      border-color: var(--white);
      background: rgba(240,236,228,.05);
    }

    .submit-line {
      width: 24px; height: 1px;
      background: var(--white);
      transition: width .3s;
    }

    .form-submit:hover .submit-line {
      width: 40px;
    }

    /* Success message */
    .form-success {
      display: none;
      padding: 3rem 0;
      text-align: center;
    }

    .form-success.show {
      display: block;
    }

    .success-icon {
      width: 48px; height: 48px;
      border: 1px solid rgba(240,236,228,.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .success-icon svg {
      width: 20px; height: 20px;
      stroke: var(--accent); fill: none; stroke-width: 1.5;
    }

    .success-title {
      font-family: var(--font-serif);
      font-weight: 200;
      font-size: 1.5rem;
      letter-spacing: .05em;
      margin-bottom: .75rem;
    }

    .success-desc {
      font-size: .75rem;
      letter-spacing: .2em;
      color: var(--grey);
    }

    /* Footer */
    footer {
      padding: 3rem;
      border-top: 1px solid rgba(240,236,228,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-name { font-family: var(--font-serif); font-weight: 200; font-size: .8rem; letter-spacing: .15em; color: var(--grey); }
    .footer-links { display: flex; gap: 2rem; }
    .footer-links a { font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: var(--grey); text-decoration: none; transition: color .3s; }
    .footer-links a:hover { color: var(--white); }

    .progress-line { position: fixed; top: 0; left: 0; height: 1px; background: rgba(200,191,176,.6); z-index: 200; width: 0%; transition: width .1s linear; }

    @media (max-width: 768px) {
      nav { padding: 1.5rem; }
      .contact-wrapper { grid-template-columns: 1fr; padding-top: 6rem; }
      .contact-left { padding: 3rem 1.5rem; border-right: none; border-bottom: 1px solid rgba(240,236,228,.08); }
      .contact-right { padding: 3rem 1.5rem; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      footer { padding: 2rem 1.5rem; flex-direction: column; gap: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>
  <div class="progress-line" id="progressLine"></div>

  <nav>
    <a href="index.html" class="nav-logo">WKH</a>
    <ul class="nav-links">
      <li><a href="works.html">作品集</a></li>
      <li><a href="about.html">關於</a></li>
      <li><a href="contact.html" class="active">聯絡</a></li>
    </ul>
  </nav>

  <div class="contact-wrapper">

    <!-- 左側資訊 -->
    <div class="contact-left">
      <div>
        <span class="contact-label">Contact</span>
        <h1 class="contact-title">有什麼<br/>想說的？</h1>
        <!-- =============================================
             聯絡頁說明文字 — 想改就改這裡
             ============================================= -->
        <p class="contact-desc">
          無論是<em>合作邀約</em>、活動記錄、人像拍攝，<br/>
          或只是想聊聊攝影，都歡迎寫信給我。
        </p>
      </div>

      <div class="contact-info">
        <!-- =============================================
             聯絡資訊 — 想改就改這裡
             ============================================= -->
        <div class="contact-info-item">
          <span class="contact-info-label">Email</span>
          <a href="mailto:huang950606@gmail.com" class="contact-info-value">huang950606@gmail.com</a>
        </div>
        <div class="contact-info-item">
          <span class="contact-info-label">Instagram</span>
          <a href="https://www.instagram.com/weeeei_k" target="_blank" class="contact-info-value">@weeeei_k</a>
        </div>
      </div>
    </div>

    <!-- 右側表單 -->
    <div class="contact-right">

      <form id="contactForm" action="https://formspree.io/f/mnjgwakq" method="POST">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">姓名</label>
            <input class="form-input" type="text" id="name" name="name" placeholder="你的名字" required />
            <div class="form-line"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required />
            <div class="form-line"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">主旨</label>
          <input class="form-input" type="text" id="subject" name="subject" placeholder="合作邀約 / 人像拍攝 / 其他" />
          <div class="form-line"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">內容</label>
          <textarea class="form-textarea" id="message" name="message" placeholder="說說你的想法..." required></textarea>
          <div class="form-line"></div>
        </div>

        <button type="submit" class="form-submit">
          送出
          <div class="submit-line"></div>
        </button>

      </form>

      <!-- 送出成功訊息 -->
      <div class="form-success" id="formSuccess">
        <div class="success-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 class="success-title">收到了！</h2>
        <p class="success-desc">我會盡快回覆你。</p>
      </div>

    </div>
  </div>

  <footer>
    <span class="footer-name">© 2025 黃帷凱 Wei Kai Huang</span>
    <div class="footer-links">
      <a href="https://www.instagram.com/weeeei_k" target="_blank">Instagram</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script>
    const cursor=document.getElementById('cursor'),follower=document.getElementById('cursorFollower');
    let mx=0,my=0,fx=0,fy=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
    (function anim(){fx+=(mx-fx)*.12;fy+=(my-fy)*.12;follower.style.left=fx+'px';follower.style.top=fy+'px';requestAnimationFrame(anim);})();
    document.querySelectorAll('a,button,.form-input,.form-textarea').forEach(el=>{
      el.addEventListener('mouseenter',()=>{cursor.style.width='16px';cursor.style.height='16px';follower.style.width='56px';follower.style.height='56px';});
      el.addEventListener('mouseleave',()=>{cursor.style.width='8px';cursor.style.height='8px';follower.style.width='32px';follower.style.height='32px';});
    });
    window.addEventListener('scroll',()=>{document.getElementById('progressLine').style.width=(window.scrollY/(document.body.scrollHeight-window.innerHeight)*100)+'%';});

    // Form submit
    const form=document.getElementById('contactForm');
    const success=document.getElementById('formSuccess');
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=form.querySelector('button');
      btn.textContent='送出中...';
      btn.disabled=true;
      try{
        const res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
        if(res.ok){
          form.style.display='none';
          success.classList.add('show');
        } else {
          btn.textContent='送出失敗，請再試一次';
          btn.disabled=false;
        }
      } catch(err){
        btn.textContent='送出失敗，請再試一次';
        btn.disabled=false;
      }
    });
  </script>
</body>
</html>
